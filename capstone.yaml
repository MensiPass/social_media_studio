name: social-media-studio
run: docker compose up -d && uvicorn app.main:app --reload
seed: python scripts/seed.py
test: pytest
base_url: http://127.0.0.1:8000
endpoints:
  - GET /health
  - POST /posts
  - GET /posts
  - GET /posts/{post_id}
  - POST /posts/{post_id}/variants/generate
  - POST /posts/{post_id}/variants
  - GET /posts/{post_id}/variants
  - GET /variants/{variant_id}
  - PATCH /variants/{variant_id}
  - POST /variants/{variant_id}/approve
  - POST /variants/{variant_id}/reject
  - POST /variants/{variant_id}/schedule
  - GET /schedule
  - GET /schedule/{slot_id}
  - GET /schedule/{slot_id}/attempts
  - GET /history
  - GET /oauth/linkedin/login
  - GET /oauth/linkedin/callback

# Background processes required in addition to the API (each in its own terminal):
#   celery -A app.core.celery_app worker --loglevel=info --pool=solo   (Windows: --pool=solo required)
#   celery -A app.core.celery_app beat --loglevel=info